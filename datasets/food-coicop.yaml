domain: "Consumer Price Statistics"
tenant: "Palumbo et al (2026) https://doi.org/10.5281/zenodo.18459651"
tags:
  - "web-scraped"
  - "groceries-and-food"
team:
  name: "Luigi Palumbo, Luca Bacco, Tiziana Laureti, Luca Vollero, and Ines Nunes"
  description: "https://doi.org/10.5281/zenodo.18459651"
schema:
  - name: "Dataset"
    businessName: ""
    description: |
      File Information:<br>
          - Format: CSV (.csv), UTF-8 encoded, comma-separated.<br>
          - Each row corresponds to one product observation.<br>
          - No missing values are present in the cleaned version.
    type: "object"
    properties:
      - name: "name"
        logicalType: "object"
        description: "Full commercial name of the product, it may include quantity or weight. Only present in the manually labelled dataset.<br>Example: 'cyprina exotic juice 1l'"
        examples:
          - "cyprina exotic juice 1l"
        businessName: "Product name"
      - name: "category"
        logicalType: "object"
        description: |
          Commercial category from the supermarket own categorization. It may be composed by multiple levels separated by a pipe (|) character. Only present in the manually labelled dataset.<br>Example: 'beverages | juices & ice-teas'
        examples:
          - "beverages | juices & ice-teas"
        businessName: "Commercial category"
      - name: "code"
        logicalType: "object"
        description: |
          Product classification at the subclass level based on the COICOP 2018 nomenclature.
          Classification was assigned via manual annotation for the manually classified file, while it is imposed by the subclass definition in the LLM-generated file. <br>Example: 'Oranges'
        examples:
          - "01.2.1.0"
        businessName: "COICOP 2018 subclass"
      - name: "title"
        logicalType: "object"
        description: "LLM-generated commercial name of the product based on the COICOP 2018 subclass definition. Only present in the LLM-generated dataset.<br>Example: 'parboiled rice'"
        examples:
          - "parboiled rice"
        businessName: "Generated product name"