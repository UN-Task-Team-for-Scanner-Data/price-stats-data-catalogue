apiVersion: "v3.1.0"
kind: "DataContract"
id: food-coicop"
version: "1.0"
status: "<a href='https://un-task-team-for-scanner-data.github.io/reproducibility-project/docs/catalogue/contributing.html#maturity-model'>Documentation level</a>: 3"
name: "COICOP 2018 classification for food products"
description:
  purpose: |
    This dataset includes product names and commercial cateogries for web scrped products from Italian, German, and Maltese supermarkets, together with their COICOP 2018 manually assigned classification at the subclass level.

    Furthermore, the dataset also includes synthetic products for all COICOP 2018 subclasses generated by different Large Language Models using the subclass definition as prompt.
  limitations: |
    <i>APA style:</i> <br>Palumbo, L., Bacco, L.,  Laureti, T., Vollero, L., & Nunes, I. (2026). COICOP 2018 classification - manual and synthetic [Dataset]. Zenodo.  https://doi.org/10.5281/zenodo.18459651<br>
    <br>
    <i>Chicago style</i><br>Luigi Palumbo, Luca Bacco, Tiziana Laureti, Luca Vollero, and Ines Nunes. "COICOP 2018 classification - manual and synthetic". Zenodo, February 2, 2026.  https://doi.org/10.5281/zenodo.18459651.<br>
    <br>
    <i>Bibtex citation</i><br><a href='https://raw.githubusercontent.com/UN-Task-Team-for-Scanner-Data/price-stats-data-catalogue/main/bitex/food-coicop.bib'>Click here for raw form</a>
  usage: |
    Open dataset, shared under "Creative Commons Attribution 4.0 International" licence on Zenodo.

    <br><br>
    <b>Links:</b><br>
    <ul>
      <li>Dataset: <a href='https://doi.org/10.5281/zenodo.18459651'>https://doi.org/10.5281/zenodo.18459651</a></li>
    </ul>
